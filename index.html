<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURAIBO // Immersive Documentary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@200;300;400;500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --furaibo-red: #f1120a; }
        /* Strict monochrome defaults */
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Inter', sans-serif; color: #ffffff; user-select: none; transition: background-color 0.4s ease, color 0.4s ease; }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; }
        .font-mono { font-family: 'Space Mono', monospace; }
        
        /* -------------------------------------------------------
           BACKGROUND CANVAS
        ------------------------------------------------------- */
        #pond-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: auto; cursor: crosshair; }
        
        /* -------------------------------------------------------
           ICON FLOAT
        ------------------------------------------------------- */
        @keyframes floatDrift1 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(22px,-16px,0); } }
        @keyframes floatDrift2 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(-24px,18px,0); } }
        @keyframes floatDrift3 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(18px,24px,0); } }
        .float-drift-1 { animation: floatDrift1 14s ease-in-out infinite; }
        .float-drift-2 { animation: floatDrift2 18s ease-in-out infinite; }
        .float-drift-3 { animation: floatDrift3 16s ease-in-out infinite; }
        .furaibo-icon { filter: none !important; box-shadow: none !important; transition: stroke 0.3s; }
        
        /* -------------------------------------------------------
           MODAL
        ------------------------------------------------------- */
        .modal-enter { animation: modalGrow 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes modalGrow { 0% { opacity: 0; transform: scale(0.98) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--furaibo-red); }

        /* -------------------------------------------------------
           RADICAL MONOCHROME - LIGHT MODE OVERRIDES
        ------------------------------------------------------- */
        body.light { background-color: #ffffff; color: #000000; }
        
        /* Hairlines */
        .hairline-b { border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        body.light .hairline-b { border-bottom: 1px solid rgba(0, 0, 0, 0.15); }
        .hairline-border { border: 1px solid rgba(255, 255, 255, 0.15); }
        body.light .hairline-border { border: 1px solid rgba(0, 0, 0, 0.15); }
        
        /* Text Inversions */
        .inv-text { color: #ffffff; }
        body.light .inv-text { color: #000000; }
        .inv-text-muted { color: #888888; }
        body.light .inv-text-muted { color: #888888; }
        
        /* Disable blend mode on white background to prevent invisible text */
        body.light .mix-blend-difference { mix-blend-mode: normal !important; }
        /* Invert the white seal image to black */
        body.light img[alt="Furaibo Seal"] { filter: invert(1); }
        /* Force svg icons to black lines */
        body.light .furaibo-icon { stroke: #000000 !important; color: #000000 !important; }
        
        /* Keep Furaibo Red strictly red */
        .keep-red { color: var(--furaibo-red) !important; }
        .hover\:text-red-500:hover { color: var(--furaibo-red) !important; }
        
        /* Buttons */
        .btn-ui { border: 1px solid rgba(255,255,255,0.2); background: transparent; transition: all 0.2s; border-radius: 2px;}
        body.light .btn-ui { border: 1px solid rgba(0,0,0,0.2); background: transparent; }

        /* -------------------------------------------------------
           TACTILE GADGET STYLES
        ------------------------------------------------------- */
        .box-light-sync { background-color: #0a0a0a; border-color: #222; }
        body.light .box-light-sync { background-color: #ffffff; border-color: #e0e0e0; }
        .box-border-sync { border-color: #222; }
        body.light .box-border-sync { border-color: #e0e0e0; }
        .box-btn-sync { border-color: #222; color: #fff; }
        body.light .box-btn-sync { border-color: #e0e0e0; color: #000; }
        body.light .box-btn-sync:hover { background-color: #000; color: #fff; }
        
        .tag-invert { background-color: #ffffff; color: #000000; }
        body.light .tag-invert { background-color: #000000; color: #ffffff; }
        .dot-invert { background-color: #ffffff; }
        body.light .dot-invert { background-color: #000000; }

        .ripple-effect {
            position: absolute; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.8);
            transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none;
        }
        body.light .ripple-effect { border: 1px solid rgba(0,0,0,0.5); }
        @keyframes rippleAnim { to { transform: scale(3); opacity: 0; } }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {

        }

    </style>

<script>
// ============================================================
//   AUDIO & GLOBAL START LOGIC
// ============================================================
let audioCtx = null;
let isAudioPlaying = false;
let ambientOsc = null;
let ambientGain = null;

// Audio context requires interaction. A click anywhere starts it.
document.body.addEventListener('click', function unlockAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    document.body.removeEventListener('click', unlockAudio);
}, { once: true });

function toggleAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const soundText = document.getElementById("sound-text");
    const soundDot = document.getElementById("sound-dot");

    if (!isAudioPlaying) {
        try {
            // Binaural Alpha Beat: 108Hz Left, 116Hz Right (8Hz Alpha Difference)
            ambientOsc = audioCtx.createOscillator();
            let oscRight = audioCtx.createOscillator();
            let merger = audioCtx.createChannelMerger(2);
            ambientGain = audioCtx.createGain();

            ambientOsc.type = "sine";
            oscRight.type = "sine";
            
            ambientOsc.frequency.setValueAtTime(108, audioCtx.currentTime); 
            oscRight.frequency.setValueAtTime(116, audioCtx.currentTime);

            ambientOsc.connect(merger, 0, 0); 
            oscRight.connect(merger, 0, 1);
            merger.connect(ambientGain);
            ambientGain.connect(audioCtx.destination);

            ambientGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            ambientGain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 3);
            
            ambientOsc.start();
            oscRight.start();
            
            ambientOsc.rightEar = oscRight; 
            isAudioPlaying = true;
            
            // Sync UI to ON
            soundText.innerText = "SOUND: ON";
            soundText.classList.replace('inv-text-muted', 'inv-text');
            soundDot.classList.replace('bg-[#555]', 'bg-white');
            if(isLightMode) soundDot.classList.replace('bg-white', 'bg-black');
            
        } catch(e) { console.error("Audio generation failed:", e); }
    } else {
        if (ambientGain) {
            ambientGain.gain.cancelScheduledValues(audioCtx.currentTime);
            ambientGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
            const oscL = ambientOsc;
            const oscR = ambientOsc.rightEar;
            setTimeout(() => { 
                try { oscL.stop(); oscR.stop(); } catch(e) {} 
            }, 1000);
        }
        ambientOsc = null;
        ambientGain = null;
        isAudioPlaying = false;
        
        // Sync UI to MUTED
        soundText.innerText = "MUTED";
        soundText.classList.replace('inv-text', 'inv-text-muted');
        soundDot.classList.replace('bg-white', 'bg-[#555]');
        soundDot.classList.replace('bg-black', 'bg-[#555]');
    }
}

// ============================================================
//   RADICAL MONOCHROME TOGGLE LOGIC
// ============================================================
let isLightMode = false;

function setMode(mode) {
    const btnW = document.getElementById('btn-w');
    const btnB = document.getElementById('btn-b');
    const soundDot = document.getElementById('sound-dot');
    
    if (mode === 'W') {
        isLightMode = true;
        document.body.classList.add('light');
        
        btnW.className = "px-1.5 h-full flex items-center justify-center bg-black text-white transition-colors cursor-pointer pt-[2px]";
        btnB.className = "px-1.5 h-full flex items-center justify-center text-[#888] hover:text-black transition-colors cursor-pointer pt-[2px]";
        
        if(isAudioPlaying) {
            soundDot.classList.replace('bg-white', 'bg-black');
        }
    } else {
        isLightMode = false;
        document.body.classList.remove('light');
        
        btnW.className = "px-1.5 h-full flex items-center justify-center text-[#888] hover:text-white transition-colors cursor-pointer pt-[2px]";
        btnB.className = "px-1.5 h-full flex items-center justify-center bg-white text-black transition-colors cursor-pointer pt-[2px]";
        
        if(isAudioPlaying) {
            soundDot.classList.replace('bg-black', 'bg-white');
        }
    }
    
    // Immediate Canvas Fill Override
    if(trailCtx && width > 0) {
        trailCtx.fillStyle = isLightMode ? '#ffffff' : '#000000';
        trailCtx.fillRect(0, 0, width, height);
    }
}

// Global T Keyboard Macro
document.addEventListener('keydown', function(event) {
    if (event.key.toLowerCase() === 't') {
        setMode(isLightMode ? 'B' : 'W');
    }
    if (event.key === 'Escape') {
        closePondModal();
    }
});

// ============================================================
//   KOI POND CANVAS LOGIC
// ============================================================
const canvas = document.getElementById('pond-canvas');
const ctx = canvas.getContext('2d');
const trailCanvas = document.createElement('canvas');
const trailCtx = trailCanvas.getContext('2d');
let width = 0, height = 0;

function resizeCanvas() {
    width = window.innerWidth || document.documentElement.clientWidth || 800;
    height = window.innerHeight || document.documentElement.clientHeight || 600;
    if (width <= 0) width = 800;
    if (height <= 0) height = 600;
    canvas.width = width;
    canvas.height = height;
    trailCanvas.width = width;
    trailCanvas.height = height;
    trailCtx.fillStyle = isLightMode ? '#ffffff' : '#000000';
    trailCtx.fillRect(0, 0, width, height);
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 50);

const ripples = [];
function addRipple(x, y, maxR = 80) { ripples.push({ x, y, radius: 2, maxRadius: maxR, opacity: 0.6 }); }
canvas.addEventListener('mousemove', (e) => { if (Math.random() < 0.08) addRipple(e.clientX, e.clientY, 35); });
canvas.addEventListener('click', (e) => { addRipple(e.clientX, e.clientY, 100); });

const kois = [
    { x: Math.random() * width, y: Math.random() * height, angle: Math.random() * Math.PI * 2, speed: 0.8, color: 'rgba(217, 35, 35, 0.4)', isCreator: true },
    { x: Math.random() * width, y: Math.random() * height, angle: Math.random() * Math.PI * 2, speed: 0.7, color: 'rgba(255, 255, 255, 0.15)', isCreator: true },
    { x: Math.random() * width, y: Math.random() * height, angle: Math.random() * Math.PI * 2, speed: 0.9, color: 'rgba(0, 0, 0, 1)', isCreator: false },
    { x: Math.random() * width, y: Math.random() * height, angle: Math.random() * Math.PI * 2, speed: 0.85, color: 'rgba(0, 0, 0, 1)', isCreator: false }
];

function drawPond() {
    if (width <= 0 || canvas.width <= 0 || trailCanvas.width <= 0) resizeCanvas();
    if (canvas.width <= 0 || canvas.height <= 0 || trailCanvas.width <= 0 || trailCanvas.height <= 0) {
        requestAnimationFrame(drawPond);
        return;
    }
    
    // Fill based on Light/Dark Mode
    ctx.fillStyle = isLightMode ? '#ffffff' : '#000000';
    ctx.fillRect(0, 0, width, height);
    trailCtx.fillStyle = isLightMode ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.02)';
    trailCtx.fillRect(0, 0, width, height);

    kois.forEach(k => {
        k.angle += (Math.random() - 0.5) * 0.035;
        k.x += Math.cos(k.angle) * k.speed;
        k.y += Math.sin(k.angle) * k.speed;
        if (k.x < -60) k.x = width + 60;
        if (k.x > width + 60) k.x = -60;
        if (k.y < -60) k.y = height + 60;
        if (k.y > height + 60) k.y = -60;

        trailCtx.save();
        trailCtx.beginPath();
        trailCtx.arc(k.x, k.y, 1.8, 0, Math.PI * 2);
        
        // Trail Color adjustment for Light Mode
        if (isLightMode && !k.isCreator) {
             trailCtx.fillStyle = 'rgba(200, 200, 200, 1)';
             trailCtx.shadowColor = 'rgba(200, 200, 200, 1)';
        } else {
             trailCtx.fillStyle = k.color;
             trailCtx.shadowColor = k.color;
        }
        
        trailCtx.shadowBlur = 4;
        trailCtx.fill();
        trailCtx.restore();

        ctx.save();
        ctx.translate(k.x, k.y);
        ctx.rotate(k.angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 5, 0, 0, Math.PI * 2);
        ctx.moveTo(-12, 0);
        ctx.quadraticCurveTo(-18, -4, -22, -2);
        ctx.moveTo(-12, 0);
        ctx.quadraticCurveTo(-18, 4, -22, 2);
        
        // Adjust Koi colors for visibility in Light Mode
        let colorBase = k.color.includes('217') ? 'rgba(241, 18, 10, 0.7)' : (isLightMode ? 'rgba(0, 0, 0, 0.5)' : 'rgba(255, 255, 255, 0.5)');
        let colorOther = isLightMode ? 'rgba(200, 200, 200, 0.6)' : 'rgba(80, 80, 80, 0.6)';
        ctx.strokeStyle = k.isCreator ? colorBase : colorOther;
        
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();
    });
    
    if (trailCanvas.width > 0 && trailCanvas.height > 0) ctx.drawImage(trailCanvas, 0, 0);

    for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += 0.8;
        r.opacity -= 0.008;
        if (r.opacity <= 0 || r.radius >= r.maxRadius) { ripples.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(241, 18, 10, ${r.opacity})`;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    requestAnimationFrame(drawPond);
}
window.onload = function() { setTimeout(drawPond, 100); };

function openPondModal(key, event) {
    if (event) event.stopPropagation();
    const modal = document.getElementById("pond-modal");
    const container = document.getElementById("modal-content-container");
    const data = modalData[key];
    if (!data) return;
    
    container.innerHTML = data.body;
    
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    
    if (key === 'million_mantras') {
        updateLocalCounterDisplay();
        document.getElementById('global-tally').innerText = globalCount.toLocaleString();
    }
}

function closePondModal() {
    const modal = document.getElementById("pond-modal");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
    if(autoPaceInterval) {
        clearInterval(autoPaceInterval);
        autoPaceInterval = null;
        
        // Reset the Auto-Pace button text visually
        const btn = document.getElementById('auto-btn');
        if (btn) {
            btn.innerText = "START AUTO-PACE";
            btn.classList.remove('bg-white', 'text-black', 'bg-black', 'text-white');
        }
    }
}

// --- Tactile Gadget Logic ---

// Pre-load the WAV audio template to allow for rapid, overlapping cloning
const namandaAudioTemplate = new Audio("assets/audio/NAMANDA.wav");
namandaAudioTemplate.preload = "auto";

function triggerMantraClick(event) {
    try {
        // Cloning allows overlapping playback even at fast tempos
        const chantAudio = namandaAudioTemplate.cloneNode();
        chantAudio.volume = 1.0;
        chantAudio.play().catch(e => console.log("Audio block:", e));
    } catch(e) {}

    const container = document.getElementById('ripple-container');
    if (container) {
        const ripple = document.createElement('div');
        ripple.classList.add('ripple-effect');
        let x = container.clientWidth / 2;
        let y = container.clientHeight / 2;
        
        if (event && event.offsetX) {
            x = event.offsetX;
            y = event.offsetY;
        }

        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        
        container.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    localMantraSessionCount++;
    updateLocalCounterDisplay();
}

function updateLocalCounterDisplay() {
    const display = document.getElementById("local-session-counter");
    if (display) {
        display.innerText = localMantraSessionCount.toString().padStart(5, '0');
    }
}

function addToGlobal(event) {
    if(localMantraSessionCount > 0) {
        globalCount += localMantraSessionCount;
        localMantraSessionCount = 0;
        updateLocalCounterDisplay();
        document.getElementById('global-tally').innerText = globalCount.toLocaleString();
        
        const btn = document.getElementById('sync-btn');
        if(btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = "SYNCED ✓";
            setTimeout(() => { btn.innerHTML = originalText; }, 1500);
        }
    }
}

function updateTempo(val) {
    currentCPM = val;
    document.getElementById('cpm-display').innerText = `${val} CPM`;
    
    if (autoPaceInterval) {
        clearInterval(autoPaceInterval);
        startAutoPaceLoop();
    }
}

function toggleAutoPace() {
    const btn = document.getElementById('auto-btn');
    if (autoPaceInterval) {
        clearInterval(autoPaceInterval);
        autoPaceInterval = null;
        btn.innerText = "START AUTO-PACE";
        btn.classList.remove('bg-white', 'text-black');
        if(document.body.classList.contains('light')) {
             btn.classList.remove('bg-black', 'text-white');
        }
    } else {
        startAutoPaceLoop();
        btn.innerText = "STOP AUTO-PACE";
        if(document.body.classList.contains('light')) {
             btn.classList.add('bg-black', 'text-white');
        } else {
             btn.classList.add('bg-white', 'text-black');
        }
    }
}

function startAutoPaceLoop() {
    const msPerClick = (60 / currentCPM) * 1000;
    autoPaceInterval = setInterval(() => {
        const btn = document.getElementById('mantra-btn');
        if(btn) {
            btn.style.transform = "scale(0.95)";
            setTimeout(() => btn.style.transform = "scale(1)", 100);
            triggerMantraClick(null);
        }
    }, msPerClick);
}

// --- Email Submission Logic ---
function submitEmail(e) {
    e.preventDefault();
    
    const input = document.getElementById('doc-email-input');
    const btn = document.getElementById('doc-email-btn');
    const msg = document.getElementById('doc-email-msg');
    const email = input.value.trim();
    
    if(!email) return;

    btn.innerText = "WAIT...";
    btn.disabled = true;

    // Generates the exact time in Argentina
    const arTime = new Date().toLocaleString("en-US", {timeZone: "America/Argentina/Buenos_Aires"});

    const scriptURL = 'https://script.google.com/macros/s/AKfycbx2AD44Pq9WqouwGnEu0RFjOEBiV5Z7-ytJiauGLQ9XMEKHY44Kx_f9EEGkVadovyzDVQ/exec';

    fetch(scriptURL, { 
        method: 'POST', 
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
            'email': email,
            'timestamp': arTime
        })
    })
    .then(() => {
        msg.innerText = "EMAIL SECURED. WE WILL BE IN TOUCH.";
        msg.classList.replace('text-[#888]', 'inv-text');
        input.value = "";
        btn.innerText = "ENTER";
        btn.disabled = false;
        setTimeout(() => { msg.innerText = ""; msg.classList.replace('inv-text', 'text-[#888]'); }, 4000);
    })
    .catch(error => {
        msg.innerText = "ERROR SAVING. PLEASE TRY AGAIN.";
        btn.innerText = "ENTER";
        btn.disabled = false;
    });
}
