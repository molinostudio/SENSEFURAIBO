<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root { --furaibo-red: #f1120a; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            user-select: none;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; }
        .font-mono { font-family: 'Space Mono', monospace; }
        
        #pond-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: auto;
            cursor: crosshair;
        }
        
        /* Floating animations for icons */
        @keyframes floatDrift1 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(22px,-16px,0); } }
        @keyframes floatDrift2 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(-24px,18px,0); } }
        @keyframes floatDrift3 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(18px,24px,0); } }
        .float-drift-1 { animation: floatDrift1 14s ease-in-out infinite; }
        .float-drift-2 { animation: floatDrift2 18s ease-in-out infinite; }
        .float-drift-3 { animation: floatDrift3 16s ease-in-out infinite; }
        .furaibo-icon { filter: none !important; box-shadow: none !important; transition: stroke 0.3s; }
        
        .modal-enter { animation: modalGrow 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes modalGrow { 0% { opacity: 0; transform: scale(0.98) translateY(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--furaibo-red); }

        /* Radical Monochrome Light Mode */
        body.light { background-color: #ffffff; color: #000000; }
        .hairline-b { border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        body.light .hairline-b { border-bottom: 1px solid rgba(0, 0, 0, 0.15); }
        .hairline-border { border: 1px solid rgba(255, 255, 255, 0.15); }
        body.light .hairline-border { border: 1px solid rgba(0, 0, 0, 0.15); }
        .inv-text { color: #ffffff; }
        body.light .inv-text { color: #000000; }
        .inv-text-muted { color: #888888; }
        body.light .inv-text-muted { color: #888888; }
        body.light .mix-blend-difference { mix-blend-mode: normal !important; }
        body.light img[alt="Furaibo Seal"] { filter: invert(1); }
        body.light .furaibo-icon { stroke: #000000 !important; color: #000000 !important; }
        .keep-red { color: var(--furaibo-red) !important; }
        .hover\:text-red-500:hover { color: var(--furaibo-red) !important; }
        .btn-ui { border: 1px solid rgba(255,255,255,0.2); background: transparent; transition: all 0.2s; border-radius: 2px; }
        body.light .btn-ui { border: 1px solid rgba(0,0,0,0.2); background: transparent; }

        /* Tactile Gadget Tokens */
        .box-light-sync { background-color: #0a0a0a; border-color: #222; }
        body.light .box-light-sync { background-color: #ffffff; border-color: #e0e0e0; }
        .box-border-sync { border-color: #222; }
        body.light .box-border-sync { border-color: #e0e0e0; }
        .box-btn-sync { border-color: #222; color: #fff; }
        body.light .box-btn-sync { border-color: #e0e0e0; color: #000; }
        body.light .box-btn-sync:hover { background-color: #000; color: #fff; }
        
        .tag-invert { background-color: #ffffff; color: #000000; }
        body.light .tag-invert { background-color: #000000; color: #ffffff; }
        .dot-invert { background-color: #ffffff; }
        body.light .dot-invert { background-color: #000000; }

        /* Smooth Momentum Scrolling for Touch Devices */
        .modal-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: thin;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.8);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        body.light .ripple-effect { border: 1px solid rgba(0,0,0,0.5); }
        @keyframes rippleAnim { to { transform: scale(3); opacity: 0; } }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;

        }

<script>
let audioCtx = null;
let isAudioPlaying = false;
let ambientOsc = null;
let ambientGain = null;

document.body.addEventListener('click', function unlockAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    document.body.removeEventListener('click', unlockAudio);
}, { once: true });

window.toggleAudio = function() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const soundText = document.getElementById("sound-text");
    const soundDot = document.getElementById("sound-dot");

    if (!isAudioPlaying) {
        try {
            // Binaural Beat + Mobile-Optimized Resonant Filter (108Hz Left, 116Hz Right)
            ambientOsc = audioCtx.createOscillator();
            let oscRight = audioCtx.createOscillator();
            let merger = audioCtx.createChannelMerger(2);
            let filter = audioCtx.createBiquadFilter();
            ambientGain = audioCtx.createGain();

            // Triangle wave passed through a 380Hz lowpass filter produces warm singing-bowl harmonics
            // that phone speakers can clearly reproduce, while keeping the deep 108Hz binaural root
            ambientOsc.type = "triangle";
            oscRight.type = "triangle";
            
            ambientOsc.frequency.setValueAtTime(108, audioCtx.currentTime); 
            oscRight.frequency.setValueAtTime(116, audioCtx.currentTime);

            filter.type = "lowpass";
            filter.frequency.setValueAtTime(380, audioCtx.currentTime);
            filter.Q.setValueAtTime(1.2, audioCtx.currentTime);

            ambientOsc.connect(merger, 0, 0); 
            oscRight.connect(merger, 0, 1);
            merger.connect(filter);
            filter.connect(ambientGain);
            ambientGain.connect(audioCtx.destination);

            // Boosted gain ramp (more than 2.5x louder than original 0.08)
            ambientGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            ambientGain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 3);
            
            ambientOsc.start();
            oscRight.start();
            
            ambientOsc.rightEar = oscRight; 
            isAudioPlaying = true;
            
            soundText.innerText = "SOUND: ON";
            soundText.classList.replace('inv-text-muted', 'inv-text');
            soundDot.classList.replace('bg-[#555]', 'bg-white');
            if(window.isLightMode) soundDot.classList.replace('bg-white', 'bg-black');
            
        } catch(e) { console.error("Audio generation failed:", e); }
    } else {
        if (ambientGain) {
            ambientGain.gain.cancelScheduledValues(audioCtx.currentTime);
            ambientGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
            const oscL = ambientOsc;
            const oscR = ambientOsc.rightEar;
            setTimeout(() => { try { oscL.stop(); oscR.stop(); } catch(e) {} }, 1000);
        }
        ambientOsc = null;
        ambientGain = null;
        isAudioPlaying = false;
        
        soundText.innerText = "MUTED";
        soundText.classList.replace('inv-text', 'inv-text-muted');
        soundDot.classList.replace('bg-white', 'bg-[#555]');
        soundDot.classList.replace('bg-black', 'bg-[#555]');
    }
};

/* ---------------------------------------------------------
   CYCLING LANGUAGE SWITCHER (EN -> ES -> 日本語)
--------------------------------------------------------- */
window.languages = ['EN', 'ES', '日本語'];
window.currentLangIndex = 0;
window.currentLang = 'EN';

window.cycleLang = function() {
    window.currentLangIndex = (window.currentLangIndex + 1) % window.languages.length;
    const nextLang = window.languages[window.currentLangIndex];
    window.currentLang = nextLang;

    const label = document.getElementById('lang-text');
    if (label) {
        label.innerText = nextLang;
    }

    if (window.applyLanguage) {
        window.applyLanguage(nextLang);
    }
};

window.isLightMode = false;

window.setMode = function(mode) {
    const btnW = document.getElementById('btn-w');
    const btnB = document.getElementById('btn-b');
    const soundDot = document.getElementById('sound-dot');
    
    if (mode === 'W') {
        window.isLightMode = true;
        document.body.classList.add('light');

const canvas = document.getElementById('pond-canvas');
const ctx = canvas.getContext('2d');
const trailCanvas = document.createElement('canvas');
window.trailCtx = trailCanvas.getContext('2d');
window.canvasWidth = 0;
window.canvasHeight = 0;

function resizeCanvas() {
    window.canvasWidth = window.innerWidth || document.documentElement.clientWidth || 800;
    window.canvasHeight = window.innerHeight || document.documentElement.clientHeight || 600;
    if (window.canvasWidth <= 0) window.canvasWidth = 800;
    if (window.canvasHeight <= 0) window.canvasHeight = 600;
    canvas.width = window.canvasWidth;
    canvas.height = window.canvasHeight;
    trailCanvas.width = window.canvasWidth;
    trailCanvas.height = window.canvasHeight;
    window.trailCtx.fillStyle = window.isLightMode ? '#ffffff' : '#000000';
    window.trailCtx.fillRect(0, 0, window.canvasWidth, window.canvasHeight);
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 50);

const ripples = [];
function addRipple(x, y, maxR = 80) { ripples.push({ x, y, radius: 2, maxRadius: maxR, opacity: 0.6 }); }
canvas.addEventListener('mousemove', (e) => { if (Math.random() < 0.08) addRipple(e.clientX, e.clientY, 35); });
canvas.addEventListener('click', (e) => { addRipple(e.clientX, e.clientY, 100); });

const kois = [
    { x: Math.random() * 800, y: Math.random() * 600, angle: Math.random() * Math.PI * 2, speed: 0.8, color: 'rgba(217, 35, 35, 0.4)', isCreator: true },
    { x: Math.random() * 800, y: Math.random() * 600, angle: Math.random() * Math.PI * 2, speed: 0.7, color: 'rgba(255, 255, 255, 0.15)', isCreator: true },
    { x: Math.random() * 800, y: Math.random() * 600, angle: Math.random() * Math.PI * 2, speed: 0.9, color: 'rgba(0, 0, 0, 1)', isCreator: false },
    { x: Math.random() * 800, y: Math.random() * 600, angle: Math.random() * Math.PI * 2, speed: 0.85, color: 'rgba(0, 0, 0, 1)', isCreator: false }
];

function drawPond() {
    if (window.canvasWidth <= 0 || canvas.width <= 0 || trailCanvas.width <= 0) resizeCanvas();
    if (canvas.width <= 0 || canvas.height <= 0 || trailCanvas.width <= 0 || trailCanvas.height <= 0) {
        requestAnimationFrame(drawPond);
        return;
    }
    
    ctx.fillStyle = window.isLightMode ? '#ffffff' : '#000000';
    ctx.fillRect(0, 0, window.canvasWidth, window.canvasHeight);
    window.trailCtx.fillStyle = window.isLightMode ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.02)';
    window.trailCtx.fillRect(0, 0, window.canvasWidth, window.canvasHeight);

    kois.forEach(k => {
        k.angle += (Math.random() - 0.5) * 0.035;
        k.x += Math.cos(k.angle) * k.speed;
        k.y += Math.sin(k.angle) * k.speed;
        if (k.x < -60) k.x = window.canvasWidth + 60;
        if (k.x > window.canvasWidth + 60) k.x = -60;
        if (k.y < -60) k.y = window.canvasHeight + 60;
        if (k.y > window.canvasHeight + 60) k.y = -60;

        window.trailCtx.save();
        window.trailCtx.beginPath();
        window.trailCtx.arc(k.x, k.y, 1.8, 0, Math.PI * 2);
        
        if (window.isLightMode && !k.isCreator) {
             window.trailCtx.fillStyle = 'rgba(200, 200, 200, 1)';
             window.trailCtx.shadowColor = 'rgba(200, 200, 200, 1)';
        } else {
             window.trailCtx.fillStyle = k.color;
             window.trailCtx.shadowColor = k.color;
        }
        
        window.trailCtx.shadowBlur = 4;
        window.trailCtx.fill();
        window.trailCtx.restore();

        ctx.save();
        ctx.translate(k.x, k.y);
        ctx.rotate(k.angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 5, 0, 0, Math.PI * 2);
        ctx.moveTo(-12, 0);
        ctx.quadraticCurveTo(-18, -4, -22, -2);
        ctx.moveTo(-12, 0);
        ctx.quadraticCurveTo(-18, 4, -22, 2);
        
        let colorBase = k.color.includes('217') ? 'rgba(241, 18, 10, 0.7)' : (window.isLightMode ? 'rgba(0, 0, 0, 0.5)' : 'rgba(255, 255, 255, 0.5)');
        let colorOther = window.isLightMode ? 'rgba(200, 200, 200, 0.6)' : 'rgba(80, 80, 80, 0.6)';
        ctx.strokeStyle = k.isCreator ? colorBase : colorOther;
        
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();
    });
    
    if (trailCanvas.width > 0 && trailCanvas.height > 0) ctx.drawImage(trailCanvas, 0, 0);

    for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += 0.8;
        r.opacity -= 0.008;
        if (r.opacity <= 0 || r.radius >= r.maxRadius) { ripples.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(241, 18, 10, ${r.opacity})`;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    requestAnimationFrame(drawPond);
}

window.openPondModal = function(key, event) {
    if (event) event.stopPropagation();
    const modal = document.getElementById("pond-modal");
    const container = document.getElementById("modal-content-container");
    const data = window.modalData[key];
    if (!data) return;
    
    container.innerHTML = data.body;
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    
    if (key === 'million_mantras') {
        window.updateLocalCounterDisplay();
        document.getElementById('global-tally').innerText = window.globalCount.toLocaleString();
        window.fetchLiveCount();
    }
};

window.closePondModal = function() {
    const modal = document.getElementById("pond-modal");
    // Intercept closing only if there are unsynced recitations
    if (window.totalUnsynced > 0 && modal.querySelector('#registration-overlay')) {
        window.isClosingModal = true;
        window.openRegistrationOverlay();
        return; 
    }
    window.forceCloseModal();
};

/* Close on backdrop touch/click */
const pondModalOverlay = document.getElementById("pond-modal");
if (pondModalOverlay) {
    pondModalOverlay.addEventListener('click', function(e) {
        if (e.target === this) {
            window.closePondModal();
        }
    });
}

window.forceCloseModal = function() {
    const modal = document.getElementById("pond-modal");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
    if(window.autoPaceInterval) {
        clearInterval(window.autoPaceInterval);
        window.autoPaceInterval = null;
        
        const btn = document.getElementById('auto-btn');
        if (btn) {
            btn.innerText = "START AUTO-PACE";
            btn.classList.remove('bg-white', 'text-black', 'bg-black', 'text-white');
        }
    }
    window.localMantraSessionCount = 0;
    window.totalUnsynced = 0;
};

const namandaAudioTemplate = new Audio("assets/audio/NAMANDA.wav");
namandaAudioTemplate.preload = "auto";

window.triggerMantraClick = function(event) {
    try {
        const chantAudio = namandaAudioTemplate.cloneNode();
        chantAudio.volume = 1.0;
        chantAudio.play().catch(e => console.log("Audio trigger:", e));
    } catch(e) {}

    const container = document.getElementById('ripple-container');
    if (container) {
        const ripple = document.createElement('div');
        ripple.classList.add('ripple-effect');
        let x = container.clientWidth / 2;
        let y = container.clientHeight / 2;
        
        if (event && event.offsetX) {
            x = event.offsetX;
            y = event.offsetY;
        }

        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        
        container.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    window.localMantraSessionCount++;
    window.totalUnsynced++;
    window.updateLocalCounterDisplay();
};

window.updateLocalCounterDisplay = function() {
    const display = document.getElementById("local-session-counter");
    if (display) {
        display.innerText = window.localMantraSessionCount.toString().padStart(5, '0');
    }
};

window.quickSync = function() {
    if (window.localMantraSessionCount > 0) {
        window.globalCount += window.localMantraSessionCount;
        const tally = document.getElementById('global-tally');
        if (tally) tally.innerText = window.globalCount.toLocaleString();
        
        window.localMantraSessionCount = 0;
        window.updateLocalCounterDisplay();
        
        const btn = document.getElementById('sync-btn');
        if(btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = "SYNCED ✓";
            setTimeout(() => { btn.innerHTML = originalText; }, 1500);
        }
    }
};

window.openRegistrationOverlay = function() {
    if(window.totalUnsynced <= 0) return;
    const overlay = document.getElementById('registration-overlay');
    if (overlay) {
        document.getElementById('overlay-session-count').innerText = window.totalUnsynced;
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
    }
};

window.cancelRegistration = function() {
    const overlay = document.getElementById('registration-overlay');
    if (overlay) {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
    }
    window.isClosingModal = false;
};

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzEZLxQUQ6FSAMRORezThPJZJcsFeDjY5gKuuHrQEbDvLqcoIDmGY1W2MjMCrD55N7Nhg/exec';

window.submitSync = function(includeData) {
    const msg = document.getElementById('reg-msg');
    let nameInput = "Anonymous";
    let locInput = "Unknown";

    if(includeData) {
        nameInput = document.getElementById('reg-name').value.trim() || "Anonymous";
        locInput = document.getElementById('reg-location').value.trim() || "Unknown";
    }

    msg.innerText = "SYNCING TO ARCHIVE...";
    msg.classList.replace('text-[#555]', 'inv-text');
    
    const countToAdd = window.totalUnsynced;
    const arTime = new Date().toLocaleString("en-US", {timeZone: "America/Argentina/Buenos_Aires"});

    fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
            'action': 'sync_mantras',
            'amount': countToAdd,
            'name': nameInput,
            'location': locInput,
            'timestamp': arTime
        })
    }).then(() => {
        msg.innerText = "SYNC COMPLETE.";
        setTimeout(() => { window.finishSyncFlow(); }, 1000);
    }).catch(() => {
        msg.innerText = "SYNCED OFFLINE.";
        setTimeout(() => { window.finishSyncFlow(); }, 1000);
    });
};

window.finishSyncFlow = function() {
    const overlay = document.getElementById('registration-overlay');
    if(overlay) {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
    }
    document.getElementById('reg-name').value = "";
    document.getElementById('reg-location').value = "";
    const msg = document.getElementById('reg-msg');
    if(msg) {
        msg.innerText = "";
        msg.classList.replace('inv-text', 'text-[#555]');
    }
    
    window.localMantraSessionCount = 0;
    window.totalUnsynced = 0;
    
    if (window.isClosingModal) {
        window.forceCloseModal();
    }
};

window.updateTempo = function(val) {
    window.currentCPM = val;
    const display = document.getElementById('cpm-display');
    if (display) display.innerText = `${val} CPM`;
    if (window.autoPaceInterval) {
        clearInterval(window.autoPaceInterval);
        window.startAutoPaceLoop();
    }
};

window.toggleAutoPace = function() {
    const btn = document.getElementById('auto-btn');
    if (window.autoPaceInterval) {
        clearInterval(window.autoPaceInterval);
        window.autoPaceInterval = null;
        if (btn) {
            btn.innerText = "START AUTO-PACE";
            btn.classList.remove('bg-white', 'text-black', 'bg-black', 'text-white');
        }
    } else {
        window.startAutoPaceLoop();
        if (btn) {
            btn.innerText = "STOP AUTO-PACE";
            if(window.isLightMode) {
                btn.classList.add('bg-black', 'text-white');
            } else {
                btn.classList.add('bg-white', 'text-black');
            }
        }
    }
};

window.startAutoPaceLoop = function() {
    const msPerClick = (60 / window.currentCPM) * 1000;
    window.autoPaceInterval = setInterval(() => {
        const btn = document.getElementById('mantra-btn');
        if(btn) {
            btn.style.transform = "scale(0.95)";
            setTimeout(() => btn.style.transform = "scale(1)", 100);
            window.triggerMantraClick(null);
        }
    }, msPerClick);
};

window.fetchLiveCount = function() {
    // Attempt local storage restore first so tally is never blank
    try {
        const cached = localStorage.getItem('furaibo_global_count');
        if (cached && !window.globalCount) {
            window.globalCount = parseInt(cached, 10) || 0;
            const display = document.getElementById('global-tally');
            if (display) display.innerText = window.globalCount.toLocaleString();
        }
    } catch(e) {}

    // Fetch with redirect follow for Google Apps Script 302 handling
    fetch(SHEET_URL + "?action=get_count&t=" + Date.now(), { 
        method: 'GET',
        redirect: 'follow',
        cache: 'no-store'
    })
    .then(res => {
        if (!res.ok) {
            return null;
        }
        return res.json();
    })
    .then(data => {
        if (data && typeof data.count !== 'undefined') {
            window.globalCount = Number(data.count) || 0;
            try {
                localStorage.setItem('furaibo_global_count', window.globalCount);
            } catch(e) {}
            const display = document.getElementById('global-tally');
            if (display) display.innerText = window.globalCount.toLocaleString();
        }
    })
    .catch(err => {
        // Gracefully keep current count without throwing loud console errors
    });
};

window.fetchLiveCount();

window.submitEmail = function(e) {
    e.preventDefault();
    const input = document.getElementById('doc-email-input');
    const btn = document.getElementById('doc-email-btn');
    const msg = document.getElementById('doc-email-msg');
    const email = input.value.trim();
    if(!email) return;

    btn.innerText = "WAIT...";
    btn.disabled = true;

    const arTime = new Date().toLocaleString("en-US", {timeZone: "America/Argentina/Buenos_Aires"});

    fetch(SHEET_URL, { 
        method: 'POST', 
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
            'action': 'email_signup',
            'email': email,
            'timestamp': arTime
        })
    })
    .then(() => {
        msg.innerText = "EMAIL SECURED. WE WILL BE IN TOUCH.";
        msg.classList.replace('text-[#888]', 'inv-text');
        input.value = "";
        btn.innerText = "ENTER";
        btn.disabled = false;
        setTimeout(() => { msg.innerText = ""; msg.classList.replace('inv-text', 'text-[#888]'); }, 4000);
    })
    .catch(error => {
        msg.innerText = "ERROR SAVING. PLEASE TRY AGAIN.";
        btn.innerText = "ENTER";
        btn.disabled = false;
    });
};
